apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers:
    - argocd.argoproj.io/resources-finalizer
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.3.7    
    # Inline Helm Values overrides
    helm:
      values: |
        # Recommended for ArgoCD: Disables the post-delete hook that keeps the 
        # app showing out-of-sync or prevents cleanup when deleting via GitOps.
        config:
          preserve: false
        
        # Optional: enable the reporting engine
        reportsServer:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno    

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
